# Blueprint do Render: https://render.com/docs/blueprint-spec
# Uso: no Render, "New +" > "Blueprint" > escolha este repositório.
services:
  - type: web
    name: oficina-digital-api
    runtime: python
    plan: free              # dorme após ~15 min sem uso; o 1º acesso demora ~1 min
    rootDir: api
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: USAR_GRAFO       # 1 = Gemini + Grafo; apague para usar a triagem simples (sem chave de IA)
        value: "1"
      - key: ORIGENS_PERMITIDAS
        value: https://rcminitor.github.io
      - key: TELEGRAM_SEGREDO_WEBHOOK
        generateValue: true   # o Render gera; copie o valor para rodar scripts/registrar_webhook.py
      # Preencha estes no painel do Render (ficam secretos, não vão para o GitHub):
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
    # O disco do plano free é efêmero: o SQLite (chamados.db) zera a cada deploy/reinício.
    # Para guardar os chamados, mude para `plan: starter` e descomente:
    # disk:
    #   name: dados
    #   mountPath: /var/data
    #   sizeGB: 1
    # e adicione a variável:  BANCO=/var/data/chamados.db
